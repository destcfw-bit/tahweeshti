<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#03110d" />
  <meta name="description" content="تحويشتي — محفظة مالية شخصية ذكية بالدينار الأردني" />
  <title>تحويشتي</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-orb"></div>
    <img src="assets/logo.png" alt="تحويشتي" class="splash-logo" />
    <div class="splash-loader"><span></span></div>
    <p>مستقبل أفضل… يبدأ اليوم</p>
  </div>

  <section id="authScreen" class="auth-screen hidden">
    <i class="lux-arc arc-a"></i><i class="lux-arc arc-b"></i><i class="lux-arc arc-c"></i>
    <div class="auth-shell">
      <div class="auth-logo-stage"><img src="assets/logo.png" alt="تحويشتي" class="auth-logo" /></div>
      <div class="auth-card glass">
        <span class="pill gold-pill">محفظتك المالية الشخصية</span>
        <h1>دخول سريع وآمن</h1>
        <p id="authSubtitle">نفس الرمز من 4 أرقام يفتح نفس بياناتك من أي جهاز.</p>
        <form id="authForm" class="auth-form" autocomplete="off">
          <label class="field pin-field"><span id="pinLabel">رمز الدخول</span><div class="pin-input-wrap"><b>▣</b><input id="authPin" type="password" inputmode="numeric" maxlength="4" minlength="4" placeholder="••••" required /></div></label>
          <label id="pinConfirmField" class="field pin-field hidden"><span>تأكيد الرمز</span><div class="pin-input-wrap"><b>▣</b><input id="authPinConfirm" type="password" inputmode="numeric" maxlength="4" minlength="4" placeholder="••••" /></div></label>
          <button id="loginSubmit" class="btn primary auth-submit" type="submit"><span>تسجيل الدخول</span><b>↗</b></button>
        </form>
        <div class="security-strip"><span></span><b>🛡</b><p>بدون إيميل — نفس الرمز يفتح نفس الحساب بسهولة</p><span></span></div>
        <button id="authInstallBtn" class="btn install-btn" type="button">⇩ <span>تنزيل التطبيق</span></button>
        <div id="authMessage" class="inline-message"></div>
      </div>
      <footer class="auth-footer">© جميع الحقوق محفوظة — Yahya Saeed</footer>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar glass">
      <button class="brand" data-nav="dashboard"><img src="assets/logo.png" alt=""><span><b>تحويشتي</b><small id="modeBadge">مزامنة مشتركة</small></span></button>
      <nav class="side-nav">
        <button class="nav-item active" data-nav="dashboard"><span>⌂</span><b>الرئيسية</b></button>
        <button class="nav-item" data-nav="transactions"><span>↕</span><b>الحركات</b></button>
        <button class="nav-item" data-nav="people"><span>♙</span><b>الأشخاص</b></button>
        <button class="nav-item" data-nav="goals"><span>◎</span><b>أهداف التحويش</b></button>
        <button class="nav-item" data-nav="planning"><span>▦</span><b>التخطيط</b></button>
        <button class="nav-item" data-nav="analytics"><span>⌁</span><b>الإحصائيات</b></button>
        <button class="nav-item" data-nav="calendar"><span>▣</span><b>الرزنامة</b></button>
        <button class="nav-item" data-nav="settings"><span>⚙</span><b>الإعدادات</b></button>
      </nav>
      <div class="side-bottom">
        <div class="sync-badge"><i></i><span>البيانات متزامنة</span></div>
        <button id="logoutBtn" class="btn danger-soft">تسجيل خروج</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap"><span class="eyebrow" id="todayLabel"></span><h2 id="pageTitle">لوحة التحكم</h2></div>
        <div class="top-actions">
          <button id="privacyBtn" class="icon-btn" title="إخفاء الأرقام">◉</button>
          <button id="themeBtn" class="icon-btn" title="تغيير المظهر">☾</button>
          <button id="refreshBtn" class="icon-btn" title="تحديث">↻</button>
          <button id="quickAddTop" class="btn primary compact">＋ حركة جديدة</button>
        </div>
      </header>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-transactions" class="view"></section>
      <section id="view-people" class="view"></section>
      <section id="view-goals" class="view"></section>
      <section id="view-planning" class="view"></section>
      <section id="view-analytics" class="view"></section>
      <section id="view-calendar" class="view"></section>
      <section id="view-settings" class="view"></section>

      <footer class="app-footer">© جميع الحقوق محفوظة — Yahya Saeed</footer>
    </main>

    <nav class="mobile-nav glass">
      <button class="active" data-nav="dashboard"><span>⌂</span>الرئيسية</button>
      <button data-nav="transactions"><span>↕</span>الحركات</button>
      <button id="mobileAdd" class="mobile-add">＋</button>
      <button data-nav="people"><span>♙</span>الأشخاص</button>
      <button data-nav="settings"><span>☷</span>المزيد</button>
    </nav>
  </div>

  <div id="modalRoot" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card glass">
      <div class="modal-head"><div><span id="modalEyebrow" class="eyebrow"></span><h3 id="modalTitle"></h3></div><button class="close-btn" data-close-modal>×</button></div>
      <div id="modalBody"></div>
    </section>
  </div>

  <div id="loading" class="loading hidden"><div class="loader-ring"></div><span>جاري التنفيذ...</span></div>
  <div id="toast" class="toast"><span id="toastText"></span><button id="toastAction" class="hidden"></button></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
